# Maestro Flow: Streamlined Prayer & Feedback Dialog
appId: com.example.selah_prototype_audio_13sep2026
---
- launchApp:
    clearState: false

- waitForAnimationToEnd

# 1. Open More Options from App Bar
- tapOn: "More Options"

- waitForAnimationToEnd

# 2. Select Prayer & Feedback
- tapOn: "Prayer & Feedback"

- waitForAnimationToEnd

# 3. Verify Dialog Header is open
- assertVisible: "Prayer & Feedback"

# 4. Tap the middle sentiment chip (Suggestion - 💡)
# Tap by approximate relative coordinate of the center sentiment button
- tapOn:
    point: "50%,41%"

- waitForAnimationToEnd

# 5. Type feedback note
- tapOn:
    point: "50%,52%"
- inputText: "Loving the peaceful contemplation and narrator audio."

- waitForAnimationToEnd

# 6. Capture verified dialog proof
- takeScreenshot: test_artifacts/maestro_feedback_dialog_verified
