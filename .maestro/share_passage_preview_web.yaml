# Signed-out share journeys on the Firebase Hosting preview channel.
#
# Point this at the dev preview channel only. Do not point it at
# https://selahword.web.app (production).
#
#   maestro test --headless --screen-size 1200x2200 \
#     --test-output-dir test_artifacts/maestro_share_preview \
#     .maestro/share_passage_preview_web.yaml
#
# Recipients are signed out. 1 Cor 13 plays narrator audio.
# A range with verse timestamps clips narrator audio.
# A range without timestamps asks before any synthetic voice and does not
# start one on its own. A broken ref stays on the player.

appId: https://selahword--dev-qxri7uvh.web.app
url: https://selahword--dev-qxri7uvh.web.app
tags:
  - share
  - web
  - preview
---
# startRecording uses Chrome DevTools screencast. Maestro 2.11.0 on this Mac
# fails that call with a no-op CDP driver ("No frames output"). Screenshots
# below are the recording. Stitch them after the run if a video is required.
- launchApp

# Cold open of a shared link. Playback starts from this load, not from
# a passage the app already had on screen.
- openLink: "https://selahword--dev-qxri7uvh.web.app/?ref=1+Cor+13:4-7"
- extendedWaitUntil:
    visible: "My Passages"
    timeout: 60000
- assertVisible: ".*SELAH.*"
- assertVisible: "1 Cor 13:4-7"
- assertNotVisible: "Sign in"
- assertNotVisible: "Couldn't open that link.*"
- assertNotVisible: "Read this passage aloud?"
- extendedWaitUntil:
    visible: "Play passage"
    timeout: 20000
- tapOn: "Play passage"
- extendedWaitUntil:
    visible: "Pause passage"
    timeout: 45000
- assertVisible: ".*Human Narrator.*"
- assertNotVisible: ".*Text-to-Speech.*"
- assertNotVisible: "Read this passage aloud?"
# The chip uses an en dash (4–7). The heading keeps a hyphen.
- assertVisible: "1 Corinthians 13:4-7"
- assertNotVisible: "Sign in"
- takeScreenshot: preview_cor13_narrator_playing

# Share. Headless Chromium reports the tap, then shows neither the share
# sheet nor a snackbar for 10s (navigator.share stays pending with no
# picker in the page tree). Do not fail the rest of the journey on that.
# The reference, ?ref= URL, and attribution are asserted on Android.
- tapOn: "Share this passage"
- extendedWaitUntil:
    visible: ".*(Link ready to share: 1 Cor 13:4-7|Couldn't share that passage|Listen to 1 Cor 13:4-7 in Selah).*"
    timeout: 4000
    optional: true
- takeScreenshot: preview_share_result
- runFlow:
    when:
      visible: ".*Listen to 1 Cor 13:4-7 in Selah.*"
    commands:
      - assertVisible: ".*ref=1\\+Cor\\+13:4-7.*"
      - assertVisible: ".*(Crossway|Public Domain|Barry Hays).*"
      - back
      - extendedWaitUntil:
          visible: ".*Link ready to share: 1 Cor 13:4-7.*"
          timeout: 10000

# Broken reference. The player stays up and does not offer playback.
- openLink: "https://selahword--dev-qxri7uvh.web.app/?ref=NotABook+99:1"
- extendedWaitUntil:
    visible: "Couldn't open that link.*"
    timeout: 30000
- assertVisible: ".*NotABook 99:1.*"
- assertVisible: ".*not a Bible passage.*"
- assertVisible: ".*SELAH.*"
- assertVisible: ".*does not open a passage.*"
- assertNotVisible: "Sign in"
# The play circle stays on screen, muted, with onTap null. Tapping it must
# not start playback.
- tapOn: "Play passage"
- assertVisible: "Couldn't open that link.*"
- assertNotVisible: "Pause passage"
- assertNotVisible: ".*Text-to-Speech.*"
- assertNotVisible: "Read this passage aloud?"
- takeScreenshot: preview_bad_ref

# Turn on the experimental narrator translations, then clip a verse range
# that has local timestamps (Psalm 23). This must stay on the human narrator.
# The experimental switch is on screen but its label is absent from the
# web semantics tree (an unlabeled node just above the catalog heading).
# At 1200x2057 that row is about 76% down the viewport.
- openLink: "https://selahword--dev-qxri7uvh.web.app/?ref=1+Cor+13:4-7"
- extendedWaitUntil:
    visible: "1 Cor 13:4-7"
    timeout: 45000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Meditation Settings"
    timeout: 15000
- extendedWaitUntil:
    visible: "CATALOG TIER.*"
    timeout: 10000
- tapOn:
    point: "50%,76%"
- extendedWaitUntil:
    visible: "BSB.*"
    timeout: 10000
- tapOn: "BSB.*"
- tapOn: "Scrim"
- openLink: "https://selahword--dev-qxri7uvh.web.app/?ref=Psalm+23:1-3"
- extendedWaitUntil:
    visible: "Psalm 23:1-3"
    timeout: 45000
- assertNotVisible: "Read this passage aloud?"
- assertNotVisible: "Sign in"
- extendedWaitUntil:
    visible: "Play passage"
    timeout: 20000
- tapOn: "Play passage"
- extendedWaitUntil:
    visible: "Pause passage"
    timeout: 45000
- assertVisible: ".*Human Narrator.*"
- assertNotVisible: ".*Text-to-Speech.*"
- assertNotVisible: "Read this passage aloud?"
- takeScreenshot: preview_psalm23_clip

# No verse timestamps for John 16. Ask before a synthetic voice.
# Do not confirm. The passage must stay quiet.
- openLink: "https://selahword--dev-qxri7uvh.web.app/?ref=John+16:32-33"
- extendedWaitUntil:
    visible: "John 16:32-33"
    timeout: 45000
- assertNotVisible: "Read this passage aloud?"
- assertNotVisible: ".*Text-to-Speech.*"
- extendedWaitUntil:
    visible: "Play passage"
    timeout: 20000
- tapOn: "Play passage"
# The dialog title is on screen but missing from the web semantics tree.
# The two buttons are exposed, and playback must stay stopped.
- extendedWaitUntil:
    visible: "Not now"
    timeout: 20000
- assertVisible: "Read aloud"
- assertNotVisible: "Pause passage"
- assertNotVisible: ".*Text-to-Speech.*"
- takeScreenshot: preview_john16_ask_before_tts
- tapOn: "Not now"
- extendedWaitUntil:
    visible: "Play passage"
    timeout: 10000
- assertNotVisible: "Not now"
- assertNotVisible: "Read aloud"
- assertNotVisible: "Pause passage"
- assertNotVisible: ".*Text-to-Speech.*"
- assertVisible: "John 16:32-33"
- takeScreenshot: preview_john16_declined
