name: Deploy PR Preview Channel

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  precheck_and_deploy:
    name: Pre-Flight WTF Scan & Preview Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Match pubspec SDK ^3.13.3 (3.24.x ships Dart 3.5.x and fails pub get).
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: AI Pre-Deployment Safety & Quality Scan
        run: python3 scripts/preview_channel_precheck.py

      # Keys live in GitHub Actions secrets, never in the repo.
      # Settings → Secrets and variables → Actions:
      #   API_BIBLE_KEY, APTABASE_KEY, POSTHOG_KEY, ESV_API_KEY
      # An empty secret is skipped so the Dart default stays REDACTED.
      - name: Build Flutter Web Release
        env:
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: |
          set -euo pipefail
          defines=()
          add_define() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "Passing --dart-define=${name} (value hidden)"
              defines+=(--dart-define="${name}=${value}")
            else
              echo "Secret ${name} is unset; leaving the compile-time default"
            fi
          }
          add_define API_BIBLE_KEY "$API_BIBLE_KEY"
          add_define APTABASE_KEY "$APTABASE_KEY"
          add_define POSTHOG_KEY "$POSTHOG_KEY"
          add_define ESV_API_KEY "$ESV_API_KEY"
          flutter build web --release "${defines[@]}"

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SELAHWORDAPP }}'
          projectId: selahwordapp
          channelId: 'pr-${{ github.event.number }}'
          expires: 7d
