name: Deploy PR Preview Channel

# pull_request runs are not created when the PR is opened with the GitHub
# App token (cursor[bot]). Pushes were recorded as 0-job failures because
# this file did not listen for push. workflow_dispatch is the supported
# way to start a run from that same token once this file is on main;
# until then, a push of this file is what actually schedules the job.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - cursor/**
  workflow_dispatch:
    inputs:
      channel:
        description: Firebase Hosting channel id on site selahword
        required: false
        default: my-passages
        type: string

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  precheck_and_deploy:
    name: Pre-Flight WTF Scan & Preview Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Match pubspec SDK ^3.13.3 (3.24.x ships Dart 3.5.x and fails pub get).
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Keys live in GitHub Actions secrets, never in the repo.
      # Settings → Secrets and variables → Actions:
      #   API_BIBLE_KEY, APTABASE_KEY, POSTHOG_KEY, ESV_API_KEY
      # An empty secret is skipped so the Dart default stays REDACTED.
      - name: Build Flutter Web Release
        env:
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: |
          set -euo pipefail
          defines=()
          add_define() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "Passing --dart-define=${name} (value hidden)"
              defines+=(--dart-define="${name}=${value}")
            else
              echo "Secret ${name} is unset; leaving the compile-time default"
            fi
          }
          add_define API_BIBLE_KEY "$API_BIBLE_KEY"
          add_define APTABASE_KEY "$APTABASE_KEY"
          add_define POSTHOG_KEY "$POSTHOG_KEY"
          add_define ESV_API_KEY "$ESV_API_KEY"
          flutter build web --release "${defines[@]}"

      # Do not put secrets in `if:`. An empty service account used to skip
      # this check and still fail the action with "Input required and not
      # supplied: firebaseServiceAccount" (run 40231935803).
      - name: Check Firebase Hosting credentials
        id: firebase_auth
        env:
          FIREBASE_SERVICE_ACCOUNT_SELAHWORDAPP: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SELAHWORDAPP }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_SELAHWORDAPP}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT_SELAHWORDAPP is set (value hidden)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_SELAHWORDAPP is unset. The web build can still include ESV_API_KEY, but Hosting will not be published. Add this Actions secret: the Firebase service account JSON for project selahwordapp, with Firebase Hosting Admin on site selahword."
          fi

      - name: Deploy to Firebase Hosting Preview Channel
        if: steps.firebase_auth.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SELAHWORDAPP }}
          projectId: selahwordapp
          channelId: ${{ github.event.inputs.channel || (github.event.number && format('pr-{0}', github.event.number)) || 'my-passages' }}
          expires: 30d

      - name: Preview URL
        if: steps.firebase_auth.outputs.present == 'true'
        run: |
          echo "Hosting preview: ${{ steps.deploy.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosting preview: ${{ steps.deploy.outputs.details_url }}"

      # Full analyze + flutter test. Runs after Hosting so a slow or
      # unrelated test failure does not block the preview URL.
      - name: AI Pre-Deployment Safety & Quality Scan
        run: python3 scripts/preview_channel_precheck.py
