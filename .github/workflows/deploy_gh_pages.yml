name: Deploy Selah Web PWA to GitHub Pages

on:
  push:
    branches:
      - v0.2_mini
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Web PWA
        run: |
          flutter build web --release --base-href "/selah_prototype_audio_13sep2026/" \
            --dart-define=API_BIBLE_KEY=${{ secrets.API_BIBLE_KEY || 'vObTBCIHvWdF3xZOH1IQM' }} \
            --dart-define=APTABASE_KEY=${{ secrets.APTABASE_KEY || 'A-US-5144164636' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
