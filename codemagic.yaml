workflows:
  selah-web-build:
    name: Selah Web Build & Deploy
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.29.0
      groups:
        - selah_secrets
      vars:
        API_BIBLE_KEY: ${API_BIBLE_KEY:-vObTBCIHvWdF3xZOH1IQM}
        APTABASE_KEY: ${APTABASE_KEY:-A-US-5144164636}
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Run unit & widget tests
        script: |
          flutter test
      - name: Build Web PWA
        script: |
          flutter build web --release \
            --dart-define=API_BIBLE_KEY=$API_BIBLE_KEY \
            --dart-define=APTABASE_KEY=$APTABASE_KEY
    artifacts:
      - build/web/**
    publishing:
      email:
        recipients:
          - neilwarner@gmail.com
        notify:
          success: true
          failure: true

  selah-android-release:
    name: Selah Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.29.0
      groups:
        - selah_secrets
      vars:
        API_BIBLE_KEY: ${API_BIBLE_KEY:-vObTBCIHvWdF3xZOH1IQM}
        APTABASE_KEY: ${APTABASE_KEY:-A-US-5144164636}
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Run unit & widget tests
        script: |
          flutter test
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Build Android APK
        script: |
          flutter build apk --release \
            --dart-define=API_BIBLE_KEY=$API_BIBLE_KEY \
            --dart-define=APTABASE_KEY=$APTABASE_KEY
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - neilwarner@gmail.com
        notify:
          success: true
          failure: true
